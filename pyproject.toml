[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vaani"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["httpx", "keyring", "python-xlib"]

[project.scripts]
vaani = "vaani.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
